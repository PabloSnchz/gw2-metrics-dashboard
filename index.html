<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Métricas — Bóveda del Gato Negro</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="container">
    <header class="header">
        <img src="https://raw.githubusercontent.com/PabloSnchz/gw2-wallet-ligero/main/assets/logo-gato-negro.png" alt="Logo" class="logo">
        <h1 class="title">📊 Métricas de la Bóveda</h1>
        <p class="subtitle">Datos de uso de la webapp — Google Analytics 4</p>
        <p id="lastUpdated" class="updated">—</p>
    </header>

    <!-- KPIs resumen -->
    <section class="kpi-grid" id="kpiGrid"></section>

    <!-- Módulos más usados -->
    <section class="card">
        <h2 class="card-title">🧩 Módulos más visitados</h2>
        <div class="chart-wrap">
            <canvas id="modulesChart"></canvas>
        </div>
    </section>

    <!-- Eventos clave -->
    <section class="card">
        <h2 class="card-title">🔑 Eventos clave</h2>
        <div class="chart-wrap">
            <canvas id="eventsChart"></canvas>
        </div>
    </section>

    <!-- Geografía -->
    <section class="card">
        <h2 class="card-title">🌍 Países</h2>
        <div id="geoList" class="geo-list"></div>
    </section>

    <!-- Dispositivos -->
    <section class="card">
        <h2 class="card-title">📱 Dispositivos</h2>
        <div class="chart-wrap small">
            <canvas id="devicesChart"></canvas>
        </div>
    </section>

    <footer class="footer">
        🐈‍⬛ <a href="https://pablosnchz.github.io/gw2-wallet-ligero/" target="_blank">Volver a la Bóveda</a>
    </footer>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
